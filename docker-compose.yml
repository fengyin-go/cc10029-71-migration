services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # 前端容器里的 127.0.0.1 是它自己，必须走 Compose 服务名访问后端。
      # 静态服务器同时代理 /api 与 /portal/api 到同一个后端实例。
      BACKEND_TARGET: http://backend:8000
      PORT: 5173
    depends_on:
      - backend
